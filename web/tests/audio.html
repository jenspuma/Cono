<!doctype html><html lang="en"><meta charset="utf-8"><title>Cono audio verification</title><base href="/"><button id="run">Run audio verification</button><pre id="results">Ready</pre><script type="module">
import { ConoAudioEngine, conoTiming } from '/src/lib/audio/ConoAudioEngine.ts';
const output=document.querySelector('#results');
const log=(s)=>output.textContent+='\n'+s;
const assert=(condition,label)=>{if(!condition)throw Error(label);log('PASS '+label);};
const NativeContext=window.AudioContext;let context;const sources=[],gains=[];
window.AudioContext=class extends NativeContext {
 constructor(){super();context=this;}
 createBufferSource(){const s=super.createBufferSource();const record={node:s,starts:[],stops:[]};sources.push(record);const start=s.start.bind(s),stop=s.stop.bind(s);s.start=(...a)=>{record.starts.push(a);start(...a);};s.stop=(...a)=>{record.stops.push(a);stop(...a);};return s;}
 createGain(){const g=super.createGain();gains.push(g);return g;}
};
document.querySelector('#run').onclick=async()=>{
 document.querySelector('#run').disabled=true;output.textContent='Running actual browser decode / audio-clock verification';
 const e=new ConoAudioEngine();
 try{
 await e.load();assert(sources.length===0,'all 13 MP3 files fetched and decoded');
 let selections=Array(14).fill(0),lines=[];
 await e.play(()=>selections,l=>{lines.push({line:l,time:context.currentTime});log('Line '+l+' at '+(context.currentTime-sources[0].starts[0][0]).toFixed(3)+'s');},next=>{selections=next;});
 const start=sources[0].starts[0][0];
 assert(sources.length===13,'13 native Web Audio sources');
 assert(sources.slice(1).every(s=>Math.abs(s.starts[0][0]-start-5.6)<1e-9),'vocals start at 5.6s');
 assert(sources.every(s=>s.node.loop&&s.stops.length===0),'all sources loop without a scheduled stop');
 assert(sources.slice(1).every(s=>Math.abs(s.node.buffer.duration-89.6)<1e-8),'all voice buffers are exactly 89.6s including padding');
 assert(Math.abs(sources[0].node.loopEnd-sources[0].node.loopStart-537.6)<1e-8,'backing repeats its original 537.6s music section');
 await new Promise(r=>setTimeout(r,6100));
 selections[0]=4;selections[1]=11;e.updateSelections();
 await new Promise(r=>setTimeout(r,7000));
 assert(selections[0]===4&&selections[1]===11,'live edits survive audio-thread notifications');
 log('Waiting for full 14-line loop...');
 await new Promise(r=>setTimeout(r,83500));
 const starts=lines.filter(l=>l.line===0);
 assert(starts.length>=2,'second verse begins automatically');
 assert(Math.abs(starts[1].time-starts[0].time-89.6)<0.15,'cycle is 89.6s with no repeated intro');
 assert(sources.length===13&&sources.every(s=>s.stops.length===0),'same sources remain running across the boundary');
 assert(selections[0]===4,'manual choices persist into next verse');
 e.stop();assert(sources.every(s=>s.stops.length===1),'Stop stops every looping source');
 await e.play(()=>selections,l=>lines.push({line:l,time:context.currentTime}));e.stop();const count=lines.length;
 await new Promise(r=>setTimeout(r,6100));assert(lines.length===count,'Stop during intro leaves no stale callbacks');
 log('COMPLETE');
 }catch(error){log('FAIL '+error.stack);}finally{e.dispose();}
};
</script></html>
